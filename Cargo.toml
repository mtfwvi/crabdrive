[workspace]
resolver = "3"
members = [
    "client",
    "common",
    "server"
]

[workspace.package]
description = "A cloud storage platform"
repository = "https://github.com/mtfwvi/crabdrive"
rust-version = "1.98.1"
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
async-trait = "0.1.92"
axum = "0.8.9"
axum-extra = "0.12.6"
axum-test = "21.1.0"
base64 = "0.23.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"]}
clap = "4.6.7"
confique = { version = "0.4.0", git = "https://github.com/mtfwvi/confique", branch = "template-more-config-options" }
console_error_panic_hook = "0.1.7"
console_log = "1.1.0"
crabdrive-common = { path = "common" }
dashmap = "6.2.1"
diesel = { version = "2.3.13", default-features = false }
diesel_migrations = "2.3.2"
dotenvy = "0.15.7"
http-body-util = "0.1.5"
icondata_core = "0.1.0"
icondata_mdi = "0.1.0"
jsonwebtoken = "11.1.0"
leptos = "0.8.20"
leptos_router = "0.8.13"
leptos-use = "0.19.2"
libsqlite3-sys = { version = "=0.38.2", features = ["bundled"] }
moka = { version = "0.12.16", features = ["future", "logging"] }
nanoid = "0.5.0"
pretty_assertions = "1.4.1"
rand = "0.10.2"
sha2 = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde-wasm-bindgen = "0.6.5"
tempfile = "3.27.0"
test-case = "3.3.1"
thaw = "0.5.0-beta"
thiserror = "2.0.20"
tokio = "1.53.1"
tower-http = { version = "0.7.1" }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
tracing-web = "0.1.3"
uuid = { version = "1.26.1", features = ["serde", "v4"]}
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
wasm-bindgen-test = "0.3.78"
web-sys = "0.3.105"
